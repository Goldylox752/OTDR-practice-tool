<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OTDR Practice Tool</title>

    <meta
        name="description"
        content="Interactive OTDR fibre optic training and troubleshooting tool."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🔦 OTDR Practice Tool</h1>
    <p>Practice identifying fibre optic events and loss.</p>
</header>

<main>

    <section class="practice-card">

        <h2>OTDR Trace</h2>

        <!-- OTDR GRAPH -->

        <div id="trace-container">

            <canvas id="otdrCanvas"></canvas>

        </div>

        <!-- QUESTION -->

        <div class="question">

            <h2 id="question">
                Which event has the highest loss?
            </h2>

            <div class="answers">

                <button
                    class="answer-btn"
                    data-answer="connector">
                    🔌 Connector
                </button>

                <button
                    class="answer-btn"
                    data-answer="splice">
                    🔗 Fusion Splice
                </button>

                <button
                    class="answer-btn"
                    data-answer="bend">
                    ↪️ Macrobend
                </button>

                <button
                    class="answer-btn"
                    data-answer="break">
                    ❌ Fibre Break
                </button>

            </div>

            <p id="result"></p>

        </div>

        <button id="next-btn">
            Next Trace
        </button>

    </section>


    <!-- STATISTICS -->

    <section class="stats">

        <div class="stat-box">

            <h3>Score</h3>

            <p id="score">0</p>

        </div>


        <div class="stat-box">

            <h3>Questions</h3>

            <p id="questions">0</p>

        </div>


        <div class="stat-box">

            <h3>Accuracy</h3>

            <p id="accuracy">0%</p>

        </div>

    </section>

</main>


<footer>

    <p>
        OTDR Practice Tool • Fibre Technician Training
    </p>

</footer>


<script src="script.js"></script>

</body>
</html>
